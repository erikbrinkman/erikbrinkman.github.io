name: deploy

on:
  workflow_dispatch:

jobs:
  gate:
    uses: ./.github/workflows/build.yml

  pages-build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      # cache lfs objects so repeat runs don't eat into the lfs bandwidth quota
      - id: lfs-key
        run: echo "key=$(git lfs ls-files -l | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-key.outputs.key }}
      - run: git lfs pull
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - run: bun export
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # separate from the build so a failed deploy re-runs without rebuilding the site
  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
