name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # cache lfs objects so repeat runs don't eat into the lfs bandwidth quota
      - id: lfs-key
        run: echo "key=$(git lfs ls-files -l | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-key.outputs.key }}
      - run: git lfs pull
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun lint
      - run: bun export
